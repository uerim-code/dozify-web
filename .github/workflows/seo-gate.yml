# The publish gate, run on the branch before it becomes the site.
#
# Documentation-only changes are excluded: the reports under docs/ are written
# by the tools themselves and changing one cannot break a page, so a commit
# that only touches them should not spend a build.
name: SEO gate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  gate:
    # On the VPS runner (unv-vps-runner-dozify-web), never GitHub-hosted
    # (Ümit, 2026-10-19). The runner has Python 3.12; check.sh needs only the
    # standard library, so there is no setup-python step.
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
        with:
          # ZORUNLU. Sitemap'teki lastmod her sayfanin SON COMMIT tarihinden
          # hesaplaniyor; ontanimli sig klon (fetch-depth: 1) yalniz ucu
          # getirir ve "git log -- <dosya>" bos doner. O zaman uretici bugunun
          # tarihine duser, commit'lenmis sitemap'le tutmaz ve kapi 72 URL'de
          # fark gorup duser -- icerikte hicbir sey degismemis olsa bile.
          fetch-depth: 0
      # Local checks only. The --live pass fetches dozify.app, which on a
      # pre-merge run still serves the old pages — it would fail on exactly the
      # pages this commit is adding. Run it after a deploy instead.
      - run: ./check.sh
